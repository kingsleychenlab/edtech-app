<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | Revizely.ai</title>
  <meta name="description" content="Log in to Revizely.ai to continue your revision workspace." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:["Inter","ui-sans-serif","system-ui"]}}}};</script>
  <link rel="stylesheet" href="../global.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-shell font-sans text-slate-950 antialiased selection:bg-indigo-200 selection:text-indigo-950">
  <header class="fixed inset-x-0 top-0 z-50 border-b border-slate-100 bg-white/95 backdrop-blur-xl">
    <nav class="mx-auto flex h-20 max-w-7xl items-center justify-between px-5 sm:px-7 lg:px-8" aria-label="Login navigation">
      <a href="../index.html" class="group flex items-center gap-3 font-extrabold tracking-tight text-slate-950" aria-label="Revizely.ai home">
        <img class="brand-logo" src="../assets/revizely-logo.png" alt="" />
        <span class="text-lg">Revizely.ai</span>
      </a>
      <a href="signup.html" class="rounded-xl bg-slate-950 px-5 py-3 text-sm font-bold text-white transition hover:bg-slate-800">Sign up</a>
    </nav>
  </header>

  <main class="auth-main">
    <section class="auth-stage" aria-labelledby="login-heading">
      <div class="auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1 id="login-heading" class="auth-heading">Log in to Revizely.ai</h1>
        <p class="auth-copy">Continue to your notes, flashcards and revision workspace.</p>

        <div class="social-grid">
          <button class="social-btn" type="button" data-provider="Google" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h6c-.3 1.3-1 2.4-2.1 3.1v2.6h3.4c2-1.8 3.3-4.5 3.3-7.7Z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.8l-3.4-2.6c-.9.6-2.2 1-3.9 1-3 0-5.6-2-6.5-4.8H2v2.7C3.8 20.3 7.6 23 12 23Z"/><path fill="#FBBC05" d="M5.5 13.8c-.2-.6-.4-1.2-.4-1.8s.1-1.3.4-1.8V7.5H2A11 11 0 0 0 1 12c0 1.6.4 3.1 1 4.5l3.5-2.7Z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3 .6 4.1 1.6l3.1-3.1A10.5 10.5 0 0 0 12 1C7.6 1 3.8 3.7 2 7.5l3.5 2.7C6.4 7.4 9 5.4 12 5.4Z"/></svg>
            Continue with Google
          </button>
          <button class="social-btn" type="button" data-provider="Apple" aria-label="Continue with Apple">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 12.8c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.7-1.8-3.3-1.8-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.8-.4 7 1.1 9.2.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.2-2.5 1.2-2.6 0 0-2.5-1-2.6-3.5ZM14.4 6c.6-.8 1.1-1.9 1-3-.9 0-2 .6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2-.5 2.7-1.3Z"/></svg>
            Apple
          </button>
          <button class="social-btn" type="button" data-provider="Microsoft" aria-label="Continue with Microsoft">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#F25022" d="M2 2h9.5v9.5H2z"/><path fill="#7FBA00" d="M12.5 2H22v9.5h-9.5z"/><path fill="#00A4EF" d="M2 12.5h9.5V22H2z"/><path fill="#FFB900" d="M12.5 12.5H22V22h-9.5z"/></svg>
            Microsoft
          </button>
        </div>

        <div class="divider">or continue with email</div>

        <form class="auth-form" data-auth-form="login">
          <label class="field-label">Email address
            <input class="auth-input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label class="field-label">Password
            <span class="password-wrap">
              <input class="auth-input" type="password" name="password" autocomplete="current-password" placeholder="Your password" required />
              <button class="password-toggle" type="button" aria-label="Show password">Show</button>
            </span>
          </label>
          <div class="form-row">
            <label class="flex items-center gap-2"><input class="h-4 w-4 accent-indigo-600" type="checkbox" /> Remember me</label>
            <a class="auth-link" href="#">Forgot password?</a>
          </div>
          <button class="auth-submit" type="submit">Log in</button>
        </form>

        <p class="auth-footer">New to Revizely.ai? <a class="auth-link" href="signup.html">Create an account</a></p>
      </div>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
